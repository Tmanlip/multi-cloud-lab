name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # Terraform Checks
  # ==========================================

  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate


  # ==========================================
  # Application Checks
  # ==========================================

  application-checks:
    name: Application Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile AWS Lambda
        run: python -m py_compile application/aws-lambda/lambda_function.py

      - name: Compile Azure Function
        run: python -m py_compile application/azure-function/function_app.py

  # ==========================================
  # AWS Authentication
  # ==========================================

  aws-auth-test:
    name: AWS OIDC Authentication
    runs-on: ubuntu-latest

    permissions:
        id-token: write
        contents: read

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v5
          with:
            role-to-assume: arn:aws:iam::052032053501:role/multicloud-forge-github-actions
            aws-region: ap-southeast-1

        - name: Verify AWS identity
          run: aws sts get-caller-identity

  # ==========================================
  # Azure Authentication
  # ==========================================

  azure-auth-test:
    name: Azure OIDC Authentication
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show \
            --query "{subscription:name, tenantId:tenantId}" \
            --output table

  # ==========================================
  # Terraform Authentication
  # ==========================================

  terraform-deploy:
    name: Terraform Plan and Deploy
    runs-on: ubuntu-latest

    needs:
      - terraform-checks
      - application-checks
      - aws-auth-test
      - azure-auth-test

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: terraform/environments/dev

    env:
        ARM_USE_OIDC: "true"
        ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

        TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        TF_VAR_azure_function_app_name: ${{ vars.TF_AZURE_FUNCTION_APP_NAME }}
        TF_VAR_azure_function_storage_name: ${{ vars.TF_AZURE_FUNCTION_STORAGE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Validate deployed infrastructure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: python tests/infrastructure/test_terraform.py

      - name: Get deployment endpoints
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: endpoints
        run: |
            AWS_BASE=$(terraform output -raw aws_health_url)
            AZURE_HEALTH=$(terraform output -raw azure_health_url)

            AWS_HEALTH="${AWS_BASE%/}/health"

            echo "aws_health=$AWS_HEALTH" >> "$GITHUB_OUTPUT"
            echo "azure_health=$AZURE_HEALTH" >> "$GITHUB_OUTPUT"

      - name: Verify multi-cloud deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
            python tests/connectivity/test_health.py \
            "${{ steps.endpoints.outputs.aws_health }}" \
            "${{ steps.endpoints.outputs.azure_health }}"

  # ==========================================
  # Azure Function Deployment
  # ==========================================

      - name: Deploy Azure Function application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          cd application/azure-function
          zip -r ../../azure-function.zip . \
            -x ".python_packages/*" \
            -x "__pycache__/*"

          az functionapp deployment source config-zip \
            --resource-group rg-mcf-dev-sea \
            --name "${{ vars.TF_AZURE_FUNCTION_APP_NAME }}" \
            --src ../../azure-function.zip

  # ==========================================
  # Failover
  # ==========================================

      - name: Test primary cloud routing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          python tests/failover/test_failover.py \
            "${{ steps.endpoints.outputs.aws_health }}" \
            "${{ steps.endpoints.outputs.azure_health }}"

      - name: Test AWS failure and Azure failover
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          python tests/failover/test_failover.py \
            "https://invalid.multicloud-forge.local/health" \
            "${{ steps.endpoints.outputs.azure_health }}"

      - name: Test total multi-cloud outage detection
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          set +e

          python tests/failover/test_failover.py \
            "https://invalid-aws.multicloud-forge.local/health" \
            "https://invalid-azure.multicloud-forge.local/health"

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "[PASS] Total outage correctly detected."
            exit 0
          fi

          echo "[FAIL] Expected exit code 1, received $EXIT_CODE."
          exit 1